spring.application.name=dealai-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/dealai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_BEFORE_PRODUCTION_USE_1234567890
app.jwt.expiration-ms=86400000
app.deal-engine.min-meaningful-saving-percent=5.0
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
